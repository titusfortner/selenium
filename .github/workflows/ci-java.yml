name: CI - Java

on:
  workflow_call:
    inputs:
      compile-manager:
        description: Build Selenium Manager from source instead of downloading the pinned binary
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      compile-manager:
        description: Build Selenium Manager from source instead of downloading the pinned binary
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: read

jobs:
  smoke:
    name: Smoke Tests
    uses: ./.github/workflows/bazel.yml
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04-arm
            tag_filters: "unit,os-sensitive,se-manager,skip-rbe,-edge"
    with:
      name: Smoke Tests (${{ matrix.os }})
      os: ${{ matrix.os }}
      needs-display: true
      rerun-with-debug: true
      remote-cache: true
      run: >
        ./scripts/github-actions/bazel-test-if-targets.sh
        --config=gh-browser
        --pin_browsers=true
        ${{ inputs.compile-manager && '--manager=host' || '' }}
        --test_tag_filters=${{ matrix.tag_filters }}${{ matrix.os == 'macos' && (github.event_name == 'pull_request' || github.event_name == 'push') && ',-edge' || '' }}
        //java/...

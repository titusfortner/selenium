name: Issue Form Labeler
on:
  issues:
    types: [ opened ]

jobs:
  label-issues:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'

      - name: Install js-yaml
        run: npm install js-yaml

      - uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const yaml = require('js-yaml');

            // Get the issue
            const issue = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });

            // Read and parse the YAML file
            const configPath = '.github/issue-labeler-config.yml';
            const configYaml = fs.readFileSync(configPath, 'utf8');
            const config = yaml.load(configYaml);

            let body = issue.data.body;
            let labels = [];

            // Process each label in the config
            for (const [label, patterns] of Object.entries(config)) {
              if (patterns.any) {
                for (const pattern of patterns.any) {
                  if (body.includes(pattern)) {
                    labels.push(label);
                    break;  // Found a match for this label, move to next label
                  }
                }
              }
            }

            // Apply labels if any are found
            if (labels.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: labels
              });
            }

            // Extract regression version if present
              const regressionMatch = body.match(/### Did this work for you before\?\s+Yes, this is a regression\s+### If yes, what version of Selenium did it work with\?\s+([^#\n]+)/);
              let regressionInfo = "";
              if (regressionMatch && regressionMatch[1]) {
                regressionInfo = `\n\n---\n**Regression from version:** ${regressionMatch[1].trim()}`;
              }

              // Remove all form sections
              body = body
                .replace(/### Selenium Language Binding[\s\S]*?(?=###|$)/, '')
                .replace(/### Does this apply to specific language bindings\?[\s\S]*?(?=###|$)/, '')
                .replace(/### What part\(s\) of Selenium does this relate to\?[\s\S]*?(?=###|$)/, '')
                .replace(/### Which browsers are you experiencing the issue with\?[\s\S]*?(?=###|$)/, '')
                .replace(/### Are you using Selenium Grid\?[\s\S]*?(?=###|$)/, '')
                .replace(/### The following statements are true[\s\S]*?(?=###|$)/, '')
                .replace(/### Did this work for you before\?[\s\S]*?(?=###|$)/, '')
                .replace(/### If yes, what version of Selenium did it work with\?[\s\S]*?(?=###|$)/, '')
                .replace(/### Operating System[\s\S]*?(?=###|$)/, '');

              // Add regression info if present
              if (regressionInfo) {
                body += regressionInfo;
              }

              // Clean up any double newlines
              body = body.replace(/\n{3,}/g, '\n\n');

              // Update the issue
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });

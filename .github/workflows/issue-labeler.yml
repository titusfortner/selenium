name: Issue Form Labeler
on:
  issues:
    types: [ opened ]

jobs:
  label-issues:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v3
      - uses: dessant/label-actions@v3
        with:
          config-path: '.github/issue-labeler-config.yml'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });

            let body = issue.data.body;

            // Extract regression version if present
            const regressionMatch = body.match(/### Did this work for you before\?\s+Yes, this is a regression\s+### If yes, what version of Selenium did it work with\?\s+([^#\n]+)/);
            let regressionInfo = "";
            if (regressionMatch && regressionMatch[1]) {
              regressionInfo = `\n\n---\n**Regression from version:** ${regressionMatch[1].trim()}`;
            }

            // Remove all form sections
            body = body
              .replace(/### Selenium Language Binding[\s\S]*?(?=###|$)/, '')
              .replace(/### Does this apply to specific language bindings\?[\s\S]*?(?=###|$)/, '')
              .replace(/### What part\(s\) of Selenium does this relate to\?[\s\S]*?(?=###|$)/, '')
              .replace(/### Which browsers are you experiencing the issue with\?[\s\S]*?(?=###|$)/, '')
              .replace(/### Are you using Selenium Grid\?[\s\S]*?(?=###|$)/, '')
              .replace(/### The following statements are true[\s\S]*?(?=###|$)/, '')
              .replace(/### Did this work for you before\?[\s\S]*?(?=###|$)/, '')
              .replace(/### If yes, what version of Selenium did it work with\?[\s\S]*?(?=###|$)/, '')
              .replace(/### Operating System[\s\S]*?(?=###|$)/, '');

            // Add regression info if present
            if (regressionInfo) {
              body += regressionInfo;
            }

            // Clean up any double newlines
            body = body.replace(/\n{3,}/g, '\n\n');

            // Update the issue
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });

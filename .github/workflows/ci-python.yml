name: CI - Python

on:
  push:
    branches:
      - tmp/linux-sandbox-experiment
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sandbox-experiment:
    name: Linux sandbox experiment
    uses: ./.github/workflows/bazel.yml
    with:
      name: Linux sandbox experiment
      needs-display: true
      run: |
        echo "::group::Environment"
        uname -a
        grep PRETTY_NAME /etc/os-release
        echo "apparmor_restrict_unprivileged_userns before: $(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo n/a)"
        sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
        echo "DISPLAY=$DISPLAY"; ls -la /tmp/.X11-unix || true
        echo "::endgroup::"
        TARGETS="//py:test/selenium/webdriver/common/visibility_tests-chrome //py:test/selenium/webdriver/common/visibility_tests-firefox //rb/spec/integration/selenium/webdriver:navigation-chrome //rb/spec/integration/selenium/webdriver:navigation-firefox"
        SANDBOXED="--modify_execution_info=TestRunner=-no-sandbox --strategy=TestRunner=sandboxed"
        COMMON="--pin_browsers=true --cache_test_results=no --test_output=errors --keep_going --verbose_failures"
        echo "::group::A. Sandboxed, headless"
        bazel test $COMMON --headless $SANDBOXED $TARGETS || echo "A exit=$?"
        echo "::endgroup::"
        echo "::group::B. Unsandboxed control, headless"
        bazel test $COMMON --headless $TARGETS || echo "B exit=$?"
        echo "::endgroup::"
        echo "::group::C. Sandboxed, headed on Xvfb"
        bazel test $COMMON $SANDBOXED $TARGETS || echo "C exit=$?"
        echo "::endgroup::"

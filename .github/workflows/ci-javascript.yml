name: Repro - first navigation abort

on:
  workflow_call:
    inputs:
      chrome_version:
        type: string
        default: '155.0.8059.39'
      iterations:
        type: string
        default: '30'
      bidi:
        type: boolean
        default: false
      headless:
        type: boolean
        default: false
      os:
        type: string
        default: windows-latest
      installer:
        type: string
        default: puppeteer
  workflow_dispatch:
    inputs:
      chrome_version:
        description: Chrome for Testing version (browser and driver)
        type: string
        default: '155.0.8059.39'
      iterations:
        description: Sessions to open
        type: string
        default: '30'
      bidi:
        description: Request webSocketUrl
        type: boolean
        default: false
      headless:
        description: Run Chrome headless
        type: boolean
        default: false
      os:
        description: Runner image
        type: string
        default: windows-latest
      installer:
        type: string
        default: puppeteer

permissions:
  contents: read

jobs:
  repro:
    name: ${{ inputs.os }} chrome ${{ inputs.chrome_version }} ${{ inputs.bidi && 'bidi' || 'classic' }}
    runs-on: ${{ inputs.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Install Chrome for Testing and ChromeDriver with @puppeteer/browsers
        if: inputs.installer == 'puppeteer'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/browsers"
          npx --yes @puppeteer/browsers install "chrome@${{ inputs.chrome_version }}" --path "$RUNNER_TEMP/browsers" | tee chrome.txt
          npx --yes @puppeteer/browsers install "chromedriver@${{ inputs.chrome_version }}" --path "$RUNNER_TEMP/browsers" | tee chromedriver.txt
          echo "CHROME=$(tail -1 chrome.txt | sed 's/^[^ ]* //')" >> "$GITHUB_ENV"
          echo "CHROMEDRIVER=$(tail -1 chromedriver.txt | sed 's/^[^ ]* //')" >> "$GITHUB_ENV"
      - name: Install Chrome for Testing and ChromeDriver with Selenium Manager
        if: inputs.installer == 'selenium-manager'
        shell: bash
        run: |
          curl -sSL -o selenium-manager.exe https://github.com/SeleniumHQ/selenium_manager_artifacts/releases/download/selenium-manager-df9ee8c/selenium-manager-windows.exe
          ./selenium-manager.exe --browser chrome --browser-version "${{ inputs.chrome_version }}" --cache-path "$RUNNER_TEMP/selenium-cache" --force-browser-download --output JSON > sm.json
          cat sm.json
          node -e "const r=JSON.parse(require('fs').readFileSync('sm.json','utf8')).result; console.log('CHROME='+r.browser_path); console.log('CHROMEDRIVER='+r.driver_path)" >> "$GITHUB_ENV"
      - name: Show executable permissions
        shell: bash
        run: |
          echo "$CHROME"
          icacls "$CHROME"
          icacls "$(dirname "$CHROME")"
      - name: Reproduce
        shell: bash
        run: >
          node .github/repro/first-navigation-abort.js
          --chromedriver "$CHROMEDRIVER" --chrome "$CHROME"
          --iterations ${{ inputs.iterations }}
          ${{ inputs.bidi && '--bidi' || '' }}
          ${{ inputs.headless && '--headless' || '' }}
          --chrome-logs
          --log chromedriver.log
      - name: Upload ChromeDriver log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: chromedriver-log-${{ inputs.chrome_version }}-${{ inputs.installer }}-${{ inputs.bidi && 'bidi' || 'classic' }}-${{ github.run_id }}
          path: chromedriver.log

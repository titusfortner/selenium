name: Pin Browsers
on:
  schedule:
    - cron: 10 0 * * *
  workflow_dispatch:
  # TODO remove this before merging to trunk
  pull_request:

jobs:
  update:
    name: Update Pinned Browsers
    uses: ./.github/workflows/bazel.yml
    with:
      name: Pin Browsers
      cache-key: pin-browsers
      run: bazel run //scripts:pinned_browsers

  pull-request:
    runs-on: ubuntu-latest
    needs: update
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2
      - name: Download patch
        uses: actions/download-artifact@v2
        with:
          name: patch-file
      - name: Apply Patch
        run: |
          git apply changes.patch
      - name: Check Changes
        run: |
          if [[ -n $(git status --porcelain common/repositories.bzl) ]]; then
          echo "CHANGES_FOUND=true" >> $GITHUB_ENV
          fi
      - name: Commit Files
        if: env.CHANGES_FOUND == 'true'
        run: |
          git config --local user.email "selenium-ci@users.noreply.github.com"
          git config --local user.name "Selenium CI Bot"
          git checkout -b update-pinned-browsers-${{ github.run_number }}
          git add common/repositories.bzl
          git commit -m "Update pinned browser versions"
      - name: Create Pull Request
        if: env.CHANGES_FOUND == 'true'
        uses: peter-evans/create-pull-request@v3
        with:
          token: ${{ secrets.SELENIUM_CI_TOKEN }}
          commit-message: Update pinned browser versions
          title: "Automated Browser Version Update"
          body: "This is an automated pull request to update pinned browsers and drivers"
          branch: "pinned-browsers-${{ github.run_number }}"
          labels: update

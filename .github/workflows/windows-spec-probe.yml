# TEMPORARY diagnostic workflow. On Windows a navigation occasionally reports success while the
# browser stays on chromedriver's start page. Measured: 625 navigations per platform, windows missed
# 5 and ubuntu 0, all 5 on fedcm.html, and the app server never received a GET for them. Waiting
# after the navigation does not let it catch up, so it is not a slow load.
#
# fedcm_spec is the only spec here with an unconditional per-example `reset_driver!`, so every
# fedcm.html navigation is the first on a brand-new session. Whether that or FedCM itself is what
# matters is still open.
#
# This round runs SE_DEBUG=true so the driver says what it did: every command and response is logged
# and chromedriver's own verbose output goes to stderr. Next to the existing line —
#
#   [nav] requested=.../fedcm.html landed=data:,
#
# the surrounding command traffic should show whether chromedriver acknowledged a navigate it never
# performed. Scoped to windows and fedcm only, for a result in minutes rather than half an hour.
#
# Delete this workflow and the logging it adds once the question is answered.
name: Windows Spec Probe

on:
  workflow_dispatch:
  # Scoped to the investigation branch: workflow_dispatch only dispatches from a repo's default
  # branch, and this never lands on trunk. Removed together with the rest of the diagnostic.
  push:
    branches:
      - c/release-blockers-review-1db122

permissions:
  contents: read

jobs:
  probe:
    name: windows
    uses: ./.github/workflows/bazel.yml
    with:
      name: spec-probe-windows
      os: windows
      needs-display: true
      run: >
        bazel test
        --keep_going
        --local_test_jobs 1
        --cache_test_results=no
        --runs_per_test=5
        --test_env=SE_DEBUG=true
        --test_output=all
        --pin_browsers=false
        --test_env=SE_FORCE_BROWSER_DOWNLOAD=true
        --test_env=SE_SKIP_DRIVER_IN_PATH=true
        //rb/spec/integration/selenium/webdriver:fedcm-chrome

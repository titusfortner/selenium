# TEMPORARY diagnostic workflow. Windows Ruby specs fail where ubuntu does not. Measured so far:
# every navigation logs where it was asked to go and where it landed, and over 625 navigations per
# platform, windows missed 5 and ubuntu 0. All 5 were fedcm.html, and the app server never received
# a GET for them (50 navigations, 45 requests served) — so the browser issued no request at all.
#
# Two things that run does NOT settle, and this one is built to separate:
#
# 1. Race or true no-op? If `get` simply returns before the browser starts, a wait should let the
#    URL catch up. Every mismatch now polls for 5 seconds:
#      [nav]      requested=.../fedcm.html landed=data:,
#      [nav-wait] +1s landed=.../fedcm.html      <- returned early; it is a race
#      [nav-wait] +5s landed=data:,              <- never navigated; not a timing problem
#
# 2. Fresh session or fedcm.html? fedcm_spec is the only spec with an unconditional per-example
#    `reset_driver!`, so "first navigation on a new session" and "fedcm.html" were the same variable
#    and the earlier claim about fresh sessions was not supported. shadow_root_spec now resets per
#    example too, so webComponents.html gets fresh sessions on the same terms. If it starts missing
#    navigations, the cause is the fresh session; if only fedcm.html does, it is FedCM-specific.
#
# ubuntu stays as the control. Delete this workflow and the logging it adds once this is answered.
name: Windows Spec Probe

on:
  workflow_dispatch:
  # Scoped to the investigation branch: workflow_dispatch only dispatches from a repo's default
  # branch, and this never lands on trunk. Removed together with the rest of the diagnostic.
  push:
    branches:
      - c/release-blockers-review-1db122

permissions:
  contents: read

jobs:
  probe:
    name: ${{ matrix.os }}
    uses: ./.github/workflows/bazel.yml
    strategy:
      fail-fast: false
      matrix:
        os: [windows, ubuntu]
    with:
      name: spec-probe-${{ matrix.os }}
      os: ${{ matrix.os }}
      needs-display: true
      run: >
        bazel test
        --keep_going
        --local_test_jobs 1
        --cache_test_results=no
        --runs_per_test=5
        --test_output=all
        --pin_browsers=false
        --test_env=SE_FORCE_BROWSER_DOWNLOAD=true
        --test_env=SE_SKIP_DRIVER_IN_PATH=true
        //rb/spec/integration/selenium/webdriver:fedcm-chrome
        //rb/spec/integration/selenium/webdriver:driver-chrome
        //rb/spec/integration/selenium/webdriver:select-chrome
        //rb/spec/integration/selenium/webdriver:shadow_root-chrome

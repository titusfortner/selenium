# TEMPORARY diagnostic workflow. Windows Ruby specs fail in a scattered way; ubuntu does not.
# Measured so far: ubuntu 0 failures in 630 examples, windows 16, over identical specs and repeats.
# Ruled out with evidence: the port reservation, and delivery — the app server served every page the
# failing specs needed, and no navigation, renderer timeout, or session teardown ever raised.
#
# The last round reported `url="data:,"` at failure, which was taken for an instrument artifact. It
# was not: chromedriver's start page is where the browser genuinely still was. So the shape is that
# a navigation reports success while the page never commits, and every later step then fails on an
# empty document (NoSuchElementError, "triggerFedCm is not defined").
#
# This round proves that directly. Every navigation logs where it was asked to go and where it
# actually landed:
#
#   [nav] requested=http://localhost:57835/webComponents.html landed=http://localhost:57835/webComponents.html
#   [nav] requested=http://localhost:57835/webComponents.html landed=data:,
#
# A `landed=data:,` line next to a 200 in the access log is the whole bug in two lines. ubuntu stays
# as the control. Delete this workflow and the logging it adds once the question is answered.
name: Windows Spec Probe

on:
  workflow_dispatch:
  # Scoped to the investigation branch: workflow_dispatch only dispatches from a repo's default
  # branch, and this never lands on trunk. Removed together with the rest of the diagnostic.
  push:
    branches:
      - c/release-blockers-review-1db122

permissions:
  contents: read

jobs:
  probe:
    name: ${{ matrix.os }}
    uses: ./.github/workflows/bazel.yml
    strategy:
      fail-fast: false
      matrix:
        os: [windows, ubuntu]
    with:
      name: spec-probe-${{ matrix.os }}
      os: ${{ matrix.os }}
      needs-display: true
      run: >
        bazel test
        --keep_going
        --local_test_jobs 1
        --cache_test_results=no
        --runs_per_test=5
        --test_output=all
        --pin_browsers=false
        --test_env=SE_FORCE_BROWSER_DOWNLOAD=true
        --test_env=SE_SKIP_DRIVER_IN_PATH=true
        //rb/spec/integration/selenium/webdriver:fedcm-chrome
        //rb/spec/integration/selenium/webdriver:driver-chrome
        //rb/spec/integration/selenium/webdriver:select-chrome
        //rb/spec/integration/selenium/webdriver:shadow_root-chrome

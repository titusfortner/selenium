# TEMPORARY diagnostic workflow. On Windows the first navigation on a freshly created session is
# aborted around 6% of the time: chromedriver's data:, start page finishes loading, the barrier
# declares no pending navigations a millisecond later, the navigate that follows gets
# errorText net::ERR_ABORTED from CDP, and chromedriver answers RESPONSE Navigate successfully
# anyway. A one second wait after session creation removes it.
#
# https://issues.chromium.org/issues/402796660 reports the same swallowed error with a different
# trigger: a click whose form submission is still deferred when the barrier runs. Its workaround,
# --disable-features=DeferRendererTasksAfterInput, took that reporter's rate from 49/60 to 0/60.
# The feature defers renderer tasks after *input*, and this probe dispatches none, so it should do
# nothing here — this run checks that rather than assuming it.
#
#   baseline fails, flag arm fails    -> different trigger, as the input-gating implies
#   both arms clean                   -> same bug after all, and the distinction was imaginary
#
# The settle wait added in an earlier commit is removed here so the baseline can still reproduce;
# dropping this diagnostic commit restores it.
#
# Delete this workflow, nav_probe_spec.rb, and the logging they depend on once this is answered.
name: Windows Spec Probe

on:
  workflow_dispatch:
  # Scoped to the investigation branch: workflow_dispatch only dispatches from a repo's default
  # branch, and this never lands on trunk. Removed together with the rest of the diagnostic.
  push:
    branches:
      - c/release-blockers-review-1db122

permissions:
  contents: read

jobs:
  probe:
    name: windows
    uses: ./.github/workflows/bazel.yml
    with:
      name: spec-probe-windows
      os: windows
      needs-display: true
      run: >
        bazel test
        --keep_going
        --local_test_jobs 1
        --cache_test_results=no
        --test_env=SE_DEBUG=true
        --test_output=all
        --pin_browsers=false
        --test_env=SE_FORCE_BROWSER_DOWNLOAD=true
        --test_env=SE_SKIP_DRIVER_IN_PATH=true
        //rb/spec/integration/selenium/webdriver:nav_probe-chrome
        //rb/spec/integration/selenium/webdriver:nav_probe-chrome-bidi

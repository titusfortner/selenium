# TEMPORARY diagnostic workflow. On Windows a navigation occasionally reports success while the
# browser stays on chromedriver's start page. chromedriver's own verbose log shows why: Page.navigate
# comes back with errorText net::ERR_ABORTED and chromedriver answers RESPONSE Navigate successfully
# anyway, dropping the error. Reproduced at 3-5 per 50 navigations, always fedcm.html, never ubuntu.
#
# Two things remain unseparated, because fedcm_spec was the only spec resetting per example, making
# "first navigation on a fresh session" and "fedcm.html" the same variable. nav_probe_spec varies one
# at a time over 25 attempts each: fedcm.html first, fedcm.html primed with blank.html, and
# formPage.html first. Reading it:
#
#   fedcm fails, formPage does not      -> specific to fedcm.html, not to fresh sessions
#   both fail                           -> it is the first navigation on a new session
#   priming fixes fedcm                 -> the first load away from data:, is what is fragile
#
# Both a classic and a BiDi target run, since BiDi reports navigation failure through a different
# path and should say something the classic one swallows. Stable chrome has no BiDi targets normally,
# so tests.bzl turns them on for the duration.
#
# SE_DEBUG=true keeps chromedriver's verbose log and the full command traffic in the output.
# Delete this workflow, nav_probe_spec.rb, and the logging they depend on once this is answered.
name: Windows Spec Probe

on:
  workflow_dispatch:
  # Scoped to the investigation branch: workflow_dispatch only dispatches from a repo's default
  # branch, and this never lands on trunk. Removed together with the rest of the diagnostic.
  push:
    branches:
      - c/release-blockers-review-1db122

permissions:
  contents: read

jobs:
  probe:
    name: windows
    uses: ./.github/workflows/bazel.yml
    with:
      name: spec-probe-windows
      os: windows
      needs-display: true
      run: >
        bazel test
        --keep_going
        --local_test_jobs 1
        --cache_test_results=no
        --test_env=SE_DEBUG=true
        --test_output=all
        --pin_browsers=false
        --test_env=SE_FORCE_BROWSER_DOWNLOAD=true
        --test_env=SE_SKIP_DRIVER_IN_PATH=true
        //rb/spec/integration/selenium/webdriver:nav_probe-chrome
        //rb/spec/integration/selenium/webdriver:nav_probe-chrome-bidi

# TEMPORARY diagnostic workflow. On Windows the first navigation on a freshly created session
# aborts around 5% of the time, on any URL. Classic chromedriver receives errorText net::ERR_ABORTED
# from CDP Page.navigate, logs "Done waiting for pending navigations. Status: ok", and answers
# RESPONSE Navigate successfully, leaving the browser on data:,. BiDi routes through the same CDP
# call but its mapper raises the error instead of dropping it. ubuntu never reproduces either.
#
# So the fault is a fresh session, not a page. These arms vary only what happens between creating
# the session and asking it to navigate, over 25 attempts each:
#
#   navigate immediately          - the baseline that fails
#   navigate a second later       - the pause the suite already gives Safari, which is slow to
#                                   release a previous session
#   navigate after blank.html     - a throwaway first navigation
#
# If the pause holds where the baseline fails, the session simply is not ready to navigate when
# chromedriver says it is. Both a classic and a BiDi target run: BiDi raises rather than silently
# succeeding, so its failures are unambiguous and make the better detector.
#
# Delete this workflow, nav_probe_spec.rb, and the logging they depend on once this is answered.
name: Windows Spec Probe

on:
  workflow_dispatch:
  # Scoped to the investigation branch: workflow_dispatch only dispatches from a repo's default
  # branch, and this never lands on trunk. Removed together with the rest of the diagnostic.
  push:
    branches:
      - c/release-blockers-review-1db122

permissions:
  contents: read

jobs:
  probe:
    name: windows
    uses: ./.github/workflows/bazel.yml
    with:
      name: spec-probe-windows
      os: windows
      needs-display: true
      run: >
        bazel test
        --keep_going
        --local_test_jobs 1
        --cache_test_results=no
        --test_env=SE_DEBUG=true
        --test_output=all
        --pin_browsers=false
        --test_env=SE_FORCE_BROWSER_DOWNLOAD=true
        --test_env=SE_SKIP_DRIVER_IN_PATH=true
        //rb/spec/integration/selenium/webdriver:nav_probe-chrome
        //rb/spec/integration/selenium/webdriver:nav_probe-chrome-bidi

# TEMPORARY diagnostic workflow. Windows Ruby specs fail in a scattered, nondeterministic way.
# Ruled out so far, with evidence: the port reservation (a probe found no half-bound app server under
# either IPv4-only or dual-stack reservation) and delivery (the app server served every page the
# failing specs needed, 194 responses, 200s including the full FedCM flow). The previous run also
# measured the platform split directly: ubuntu 0 failures in 18 executions, windows 3.
#
# This round asks what the browser actually had when a spec failed. Under SE_DIAGNOSE each failure
# prints a snapshot next to the server's access log:
#
#   [page-state] bodyBytes=512 customElement="defined" matches=1 readyState="complete" url=".../webComponents.html"
#
# Compare against that healthy baseline: customElement="undefined" means the page's script had not
# upgraded the element, matches=0 means it was not in the DOM, a non-complete readyState means the
# page was still loading, and a wrong url means the navigation did not stick.
#
# runs_per_test is 5 because the observed failure rate is roughly 3 in 18, so single samples are
# close to useless. ubuntu stays as the control.
#
# Delete this workflow, and the SE_DIAGNOSE blocks it depends on, once the question is answered.
name: Windows Spec Probe

on:
  workflow_dispatch:
  # Scoped to the investigation branch: workflow_dispatch only dispatches from a repo's default
  # branch, and this never lands on trunk. Removed together with the rest of the diagnostic.
  push:
    branches:
      - c/release-blockers-review-1db122

permissions:
  contents: read

jobs:
  probe:
    name: ${{ matrix.os }}
    uses: ./.github/workflows/bazel.yml
    strategy:
      fail-fast: false
      matrix:
        os: [windows, ubuntu]
    with:
      name: spec-probe-${{ matrix.os }}
      os: ${{ matrix.os }}
      needs-display: true
      run: >
        bazel test
        --keep_going
        --local_test_jobs 1
        --cache_test_results=no
        --runs_per_test=5
        --test_output=all
        --pin_browsers=false
        --test_env=SE_FORCE_BROWSER_DOWNLOAD=true
        --test_env=SE_SKIP_DRIVER_IN_PATH=true
        --test_env=SE_DIAGNOSE=1
        //rb/spec/integration/selenium/webdriver:fedcm-chrome
        //rb/spec/integration/selenium/webdriver:driver-chrome
        //rb/spec/integration/selenium/webdriver:select-chrome
        //rb/spec/integration/selenium/webdriver:shadow_root-chrome

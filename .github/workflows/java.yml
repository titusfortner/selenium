name: Java workflow

on:
  workflow_dispatch:
  push:
    branches:
      - trunk
  pull_request:
    branches:
      - trunk

env:
  NODE_VERSION: '13.x'

jobs:
  browser_tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [ chrome, firefox, edge ]
        version: [ latest ]
        include:
          - browser: 'firefox'
            version: 'latest-devedition'
    steps:
      - name: Checkout source tree
        uses: actions/checkout@v2
      - name: Cache Bazel artifacts
        uses: actions/cache@v2
        with:
          path: |
            ~/.cache/bazel-disk
            ~/.cache/bazel-repo
          key: ${{ runner.os }}-bazel-${{ matrix.browser }}-tests-${{ hashFiles('**/BUILD.bazel') }}
          restore-keys: |
            ${{ runner.os }}-bazel-${{ matrix.browser }}-tests-
            ${{ runner.os }}-bazel-build-
      - name: Setup bazelisk
        uses: ./.github/actions/setup-bazelisk
      - name: Setup Java
        uses: actions/setup-java@v1
        with:
          java-version: '11'
      - name: Setup Firefox
        uses: browser-actions/setup-firefox@latest
        if: |
          matrix.browser == 'firefox'
        with:
          firefox-version: ${{ matrix.version }}
      - name: Setup GeckoDriver
        uses: ./.github/actions/setup-firefox
        if: |
          matrix.browser == 'firefox'
      - name: Setup Chrome and ChromeDriver
        uses: ./.github/actions/setup-chrome
        if: |
          matrix.browser == 'chrome'
      - name: Setup EdgeDriver
        uses: ./.github/actions/setup-edge
        if: |
          matrix.browser == 'edge'
      - name: Start XVFB
        run: Xvfb :99 &
      - name: Run browser tests in ${{ matrix.browser }}
        uses: ./.github/actions/bazel-test
        with:
          query: attr(tags, ${{ matrix.browser }}, tests(//java/...)) except attr(tags, 'lint|rc|remote', tests(//java/...))
          attempts: 3
        env:
          DISPLAY: :99

  server_tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [ chrome, firefox, edge ]
        version: [ latest ]
        include:
          - browser: 'firefox'
            version: 'latest-devedition'
    steps:
      - name: Checkout source tree
        uses: actions/checkout@v2
      - name: Cache Bazel artifacts
        uses: actions/cache@v2
        with:
          path: |
            ~/.cache/bazel-disk
            ~/.cache/bazel-repo
          key: ${{ runner.os }}-bazel-${{ matrix.browser }}-server-tests-${{ hashFiles('**/BUILD.bazel') }}
          restore-keys: |
            ${{ runner.os }}-bazel-${{ matrix.browser }}-server-tests-
            ${{ runner.os }}-bazel-${{ matrix.browser }}-tests-
            ${{ runner.os }}-bazel-build-
      - name: Setup bazelisk
        uses: ./.github/actions/setup-bazelisk
      - name: Setup Java
        uses: actions/setup-java@v1
        with:
          java-version: '11'
      - name: Setup Firefox
        uses: browser-actions/setup-firefox@latest
        if: |
          matrix.browser == 'firefox'
        with:
          firefox-version: ${{ matrix.version }}
      - name: Setup GeckoDriver
        uses: ./.github/actions/setup-firefox
        if: |
          matrix.browser == 'firefox'
      - name: Setup Chrome and ChromeDriver
        uses: ./.github/actions/setup-chrome
        if: |
          matrix.browser == 'chrome'
      - name: Setup EdgeDriver
        uses: ./.github/actions/setup-edge
        if: |
          matrix.browser == 'edge'
      - name: Start XVFB
        run: Xvfb :99 &
      - name: Run server tests
        uses: ./.github/actions/bazel-test
        with:
          query: attr(tags, ${{ matrix.browser }}, tests(//java/...)) intersect attr(tags, 'remote', tests(//java/...))
          attempts: 3
        env:
          DISPLAY: :99


name: CI - Ruby

on:
  workflow_call:
    inputs:
      smoke:
        description: Smoke tests always run; callers pass false to add the full matrix
        required: false
        type: boolean
        default: true
      compile-manager:
        description: Build Selenium Manager from source instead of downloading the pinned binary
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      smoke:
        description: Smoke tests only (default also runs the full matrix)
        required: false
        type: boolean
        default: false
      compile-manager:
        description: Build Selenium Manager from source instead of downloading the pinned binary
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # WIP: compare one unit target (unit-single) against one target per spec file (unit)
  unit-tests:
    name: Unit (${{ matrix.layout }}, ${{ matrix.ruby-version || 'default' }}, ${{ matrix.os }})
    uses: ./.github/workflows/bazel.yml
    strategy:
      fail-fast: false
      matrix:
        layout: [unit-single, unit]
        os: [windows, macos, ubuntu]
        ruby-version: ['']
        include:
          - {layout: unit-single, os: ubuntu, ruby-version: jruby-10.1.0.0}
          - {layout: unit, os: ubuntu, ruby-version: jruby-10.1.0.0}
          - {layout: unit-single, os: ubuntu, ruby-version: truffleruby-34.0.1}
          - {layout: unit, os: ubuntu, ruby-version: truffleruby-34.0.1}
    with:
      name: Unit (${{ matrix.layout }}, ${{ matrix.ruby-version || 'default' }}, ${{ matrix.os }})
      os: ${{ matrix.os }}
      ruby-version: ${{ matrix.ruby-version }}
      run: >
        bazel test
        --build_tests_only
        --keep_going
        --test_tag_filters=${{ matrix.layout }}
        //rb/spec/unit/...

  # WIP: trunk config vs browser resource with each unit layout
  smoke:
    name: Smoke (${{ matrix.config.name }}, ${{ matrix.os }})
    uses: ./.github/workflows/bazel.yml
    strategy:
      fail-fast: false
      matrix:
        os: [windows, macos]
        config:
          - {name: jobs1-single, flag: --local_test_jobs 1, layout: unit-single}
          - {name: browser1-single, flag: --local_resources=browser=1, layout: unit-single}
          - {name: browser1-perfile, flag: --local_resources=browser=1, layout: unit}
    with:
      name: Smoke (${{ matrix.config.name }}, ${{ matrix.os }})
      needs-display: true
      os: ${{ matrix.os }}
      run: >
        bazel test
        --build_tests_only
        --keep_going
        --flaky_test_attempts 2
        ${{ matrix.config.flag }}
        --pin_browsers=false
        --test_env=SE_FORCE_BROWSER_DOWNLOAD=true
        --test_env=SE_SKIP_DRIVER_IN_PATH=true
        --test_env=SKIP_PENDING=true
        --test_tag_filters=${{ matrix.config.layout }},os-sensitive,se-manager,skip-rbe
        //rb/...

name: CI - Ruby

on:
  workflow_call:
    inputs:
      smoke:
        description: Smoke tests always run; callers pass false to add the full matrix
        required: false
        type: boolean
        default: true
      compile-manager:
        description: Build Selenium Manager from source instead of downloading the pinned binary
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      smoke:
        description: Smoke tests only (default also runs the full matrix)
        required: false
        type: boolean
        default: false
      compile-manager:
        description: Build Selenium Manager from source instead of downloading the pinned binary
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # WIP: compare Ruby unit layouts on Windows; each job uploads its Bazel profile
  unit-tests:
    name: Unit (${{ matrix.layout }}, windows)
    uses: ./.github/workflows/bazel.yml
    strategy:
      fail-fast: false
      matrix:
        layout: [unit, unit-dir, unit-perfile]
    with:
      name: Unit (${{ matrix.layout }}, windows)
      os: windows
      artifact-name: profile-unit-${{ matrix.layout }}
      artifact-path: build/profile-unit-${{ matrix.layout }}.json.gz
      run: >
        bazel test
        --build_tests_only
        --keep_going
        --profile=build/profile-unit-${{ matrix.layout }}.json.gz
        --experimental_profile_include_target_label
        --test_tag_filters=${{ matrix.layout }}
        //rb/spec/unit/...

  smoke:
    name: Smoke (${{ matrix.layout }}, windows)
    uses: ./.github/workflows/bazel.yml
    strategy:
      fail-fast: false
      matrix:
        layout: [unit, unit-dir, unit-perfile]
    with:
      name: Smoke (${{ matrix.layout }}, windows)
      needs-display: true
      os: windows
      artifact-name: profile-smoke-${{ matrix.layout }}
      artifact-path: build/profile-smoke-${{ matrix.layout }}.json.gz
      run: >
        bazel test
        --build_tests_only
        --keep_going
        --flaky_test_attempts 2
        --local_resources=browser=1
        --pin_browsers=false
        --profile=build/profile-smoke-${{ matrix.layout }}.json.gz
        --experimental_profile_include_target_label
        --test_env=SE_FORCE_BROWSER_DOWNLOAD=true
        --test_env=SE_SKIP_DRIVER_IN_PATH=true
        --test_env=SKIP_PENDING=true
        --test_tag_filters=${{ matrix.layout }},os-sensitive,se-manager,skip-rbe
        //rb/...

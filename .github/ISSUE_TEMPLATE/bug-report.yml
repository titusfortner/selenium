name: 🐛 Bug Report
description: File a bug report
title: "[🐛 Bug]: "
labels: [ I-defect, A-needs-triaging ]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: |
        Describe clearly and concisely the bug including instructions showing how to reproduce it.
      placeholder: |
        Please add as many details as possible to avoid assumptions from our side. How do you
        trigger this bug? What did you expect to happen? Please walk us through it step by step.
        Notes:
        If the issue is with Google Chrome consider logging an issue with ChromeDriver instead:
        https://bugs.chromium.org/p/chromedriver
        If the issue is with Firefox GeckoDriver (aka Marionette) consider logging an issue with
        Mozilla: https://bugzilla.mozilla.org/buglist.cgi?product=Testing&component=Marionette
        If the issue is with Microsoft Edge consider logging an issue with Microsoft instead:
        https://developer.microsoft.com/en-us/microsoft-edge/platform/issues/
        If the issue is with Safari, only Safari 10+ is supported. Please log any Safari issue
        with Apple: https://bugreport.apple.com/
    validations:
      required: true
  - type: checkboxes
    id: prerequisites
    attributes:
      label: Prerequisites
      description: Please confirm you've completed the following steps before submitting your bug report.
      options:
        - label: I have checked that this issue hasn't already been reported in the existing issues
          required: true
        - label: I have verified this is a Selenium issue and not a browser driver-specific issue
          required: true
        - label: I have included a minimal reproducible example in my report
          required: true
  - type: textarea
    id: repro-command
    attributes:
      label: How can we reproduce the issue?
      description: |
        Share with a code snippet or a GitHub repo to reproduce the issue.
      placeholder: |
        Please share the code script to reproduce the issue. If more than one file is needed,
        create a GitHub repository and share the link.
        This will be automatically formatted into code, so no need for backticks.
        Be sure to include an SSCCE (Short, Self Contained, Correct
        [compilable] example) http://sscce.org/
        Issues without a reproduction script are likely to stall and eventually be closed.
      render: shell
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: |
        Please copy and paste any relevant log output.
        Ideally, turn on more detailed logging: https://www.selenium.dev/documentation/webdriver/troubleshooting/logging/
        This will be automatically formatted, so no need for backticks.
      render: shell
    validations:
      required: true
  - type: dropdown
    id: operating-system
    attributes:
      label: Operating System
      description: What host operating system are you using to run Selenium?
      options:
        - Windows 10/11
        - macOS (Monterey/Big Sur/Ventura/Sonoma)
        - Ubuntu
        - Debian
        - CentOS/RHEL
        - Other Linux
        - Other (please specify in the description)
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: Selenium Language Binding
      description: Which Selenium language binding are you using?
      options:
        - Java
        - Python
        - JavaScript/Node.js
        - C#
        - Ruby
        - Kotlin
        - Other (please specify in the description)
    validations:
      required: true
  - type: input
    id: selenium-version
    attributes:
      label: Selenium version
      description: What release version of Selenium are you using?
      placeholder: e.g., Java 4.10.0, Ruby 4.8.1, etc. (please use the full version number)
    validations:
      required: true
  - type: dropdown
    id: browsers
    attributes:
      label: Which browsers are you experiencing the issue with?
      multiple: true
      options:
        - Chrome
        - Firefox
        - Edge
        - Safari
        - Internet Explorer
        - Opera
        - Other (please specify in the description)
    validations:
      required: true
  - type: input
    id: browser-versions
    attributes:
      label: Browser versions
      description: What are the specific browser versions you're using?
      placeholder: Example - Chrome 120, Firefox 119, etc.
    validations:
      required: true
  - type: input
    id: browser-driver-versions
    attributes:
      label: Browser driver versions
      description: What browser driver(s) are you using?
      placeholder: Example - ChromeDriver 120.0.6099.71, GeckoDriver 0.33.0, etc.
    validations:
      required: true
  - type: dropdown
    id: using-grid
    attributes:
      label: Are you using Selenium Grid?
      options:
        - "No"
        - "Yes"
    validations:
      required: true
  - type: input
    id: selenium-grid-version
    attributes:
      label: Selenium Grid version
      description: If using Grid, what version are you using?
      placeholder: Example - 4.10.0

name: 🐛 Bug Report
description: File a bug report
title: "[🐛 Bug]: "
labels: [ I-defect, A-needs-triaging ]
body:
  - type: markdown
    id: start
    attributes:
      value: |
        *Thanks for taking the time to fill out this bug report!*
  - type: textarea
    id: what-happened
    attributes:
      label: Explain what happened and what you expected to happen
      placeholder: |
        Please add as many details as possible:

        * How do you trigger this bug? (step by step)
        * What error message do you get?
        * What is the stacktrace?
    validations:
      required: true
  - type: textarea
    id: repro-command
    attributes:
      label: How can we reproduce the issue?
      placeholder: |
        (This section renders as code, no need for backticks)

        * Issues without a reproduction script are more likely to be closed.
        * If more than one file is needed, create a new GitHub repository and link it here.
        * Reproduction should be SSCCE: Short, Self Contained, Correct (Compilable), Example.
      render: shell
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Turn on logging to help us debug the problem
      placeholder: |
        Set log level to debug: https://www.selenium.dev/documentation/webdriver/troubleshooting/logging/
      render: logs
  - type: markdown
    id: start
    attributes:
      value: |

        ---
        ## Important: Help us Understand Your Issue
  - type: dropdown
    id: issue-history
    attributes:
      label: Did this work for you before?
      options:
        - Yes, this is a regression
        - Not sure, this is my first time trying it
    validations:
      required: true
  - type: checkboxes
    id: prerequisites
    attributes:
      label: Please verify the following-
      options:
        - label: This applies to the most recent version of Selenium (we can't fix old versions)
          required: true
        - label: This hasn't already been reported
          required: true
  - type: dropdown
    id: operating-system
    attributes:
      label: Operating System
      options:
        - Windows
        - macOS
        - Linux (please specify in the description)
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: Selenium Language Binding
      options:
        - Java
        - Python
        - JavaScript/Node.js
        - C#/.NET
        - Ruby
    validations:
      required: true
  - type: dropdown
    id: browsers
    attributes:
      label: Which browsers are you experiencing the issue with?
      multiple: true
      options:
        - Chrome
        - Firefox
        - Edge
        - Safari
        - N/A
    validations:
      required: true
  - type: dropdown
    id: using-grid
    attributes:
      label: Are you using Selenium Grid?
      options:
        - "No"
        - "Yes"
    validations:
      required: true


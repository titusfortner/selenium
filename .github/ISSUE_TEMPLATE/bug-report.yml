name: 🐛 Bug Report
description: File a bug report
title: "[🐛 Bug]: "
labels: [ I-defect, A-needs-triaging ]
body:
  - type: markdown
    id: start
    attributes:
      value: |
        *Thanks for taking the time to fill out this bug report!*
  - type: textarea
    id: what-happened
    attributes:
      label: Explain what happened and what you expected to happen
      placeholder: |
        Please add as many details as possible:

        * How do you trigger this bug? (step by step)
        * What error message do you get?
        * What is the stacktrace?
    validations:
      required: true
  - type: textarea
    id: repro-command
    attributes:
      label: How can we reproduce the issue?
      placeholder: |
        (This section renders as code, no need for backticks)

        * We can't fix an issue we can't reproduce.
        * If more than one file is needed, create a new GitHub repository and link it here.
        * Reproduction should be SSCCE: Short, Self Contained, Correct (Compilable), Example.
      render: shell
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logged output - https://www.selenium.dev/documentation/webdriver/troubleshooting/logging/
      placeholder: |
        * This is for console logs, the stack trace should be copied above
        * Make sure the level is set to debug
      render: logs
  - type: markdown
    id: start
    attributes:
      value: |
        &nbsp;

        ## Help us Understand Your Issue
  - type: checkboxes
    id: prerequisites
    attributes:
      label: First, please verify the following
      options:
        - label: This applies to the most recent version of Selenium (we can't fix old versions)
          required: true
        - label: This hasn't already been reported
          required: true
        - label: All information necessary to reproduce the issue has been provided above
          required: true
  - type: dropdown
    id: issue-history
    attributes:
      label: Did this work for you before?
      options:
        - Not sure, this is my first time trying it
        - Yes, this is a regression
    validations:
      required: true
  - type: input
    id: last-working-version
    attributes:
      label: Last working version
      description: What was the last version where this feature worked correctly?
      placeholder: "e.g., 4.8.0"
    validations:
      required: false
    if: ${{ contains(body.issue-history, 'Yes, this is a regression') }}
  - type: dropdown
    id: operating-system
    attributes:
      label: Operating System
      options:
        - Windows
        - macOS
        - Linux (please specify in the description)
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: Selenium Language Binding
      options:
        - Java
        - Python
        - JavaScript/Node.js
        - C#/.NET
        - Ruby
    validations:
      required: true
  - type: dropdown
    id: browsers
    attributes:
      label: Which browsers are you experiencing the issue with?
      multiple: true
      options:
        - Chrome
        - Firefox
        - Edge
        - Safari
        - N/A
    validations:
      required: true
  - type: dropdown
    id: using-grid
    attributes:
      label: Are you using Selenium Grid?
      options:
        - "No"
        - "Yes"
    validations:
      required: true


name: 🐛 Bug Report
description: File a bug report
title: "[🐛 Bug]: "
labels: [ I-defect, A-needs-triaging ]
body:
  - type: markdown
    id: start
    attributes:
      value: |
        *Thanks for taking the time to fill out this bug report!*
  - type: textarea
    id: what-happened
    attributes:
      label: Explain what happened and what you expected to happen
      placeholder: |
        Please add as many details as possible to avoid assumptions from our side. How do you
        trigger this bug? Please walk us through it step by step. Include error messages and
        stacktrace information if applicable.
    validations:
      required: true
  - type: textarea
    id: repro-command
    attributes:
      label: How can we reproduce the issue?
      placeholder: |
        (This section renders as code, no need for backticks)

        Please share the code to reproduce the issue. If more than one file is needed,
        create a GitHub repository and share the link.
        Be sure to include an SSCCE (Short, Self Contained, Correct
        [compilable] example) http://sscce.org/
        Issues without a reproduction script are likely to stall and eventually be closed.
      render: shell
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Turn on logging to help us debug the problem
      placeholder: |
        Set log level to debug: https://www.selenium.dev/documentation/webdriver/troubleshooting/logging/
      render: logs
  - type: markdown
    id: start
    attributes:
      value: |
        ## Important: Help us Understand Your Issue
  - type: dropdown
    id: issue-history
    attributes:
      label: Did this work for you before?
      options:
        - Yes, this is a regression
        - Not sure, this is my first time trying it
    validations:
      required: true
  - type: checkboxes
    id: prerequisites
    attributes:
      label: Prerequisites
      description: Please confirm you've completed the following steps before submitting your bug report.
      options:
        - label: I confirm this issue applies to the most recent version of Selenium
        - label: I have checked that this issue hasn't already been reported in the existing issues
          required: true
        - label: I have verified this is a Selenium issue and not a browser driver-specific issue
          required: true
        - label: I have included a minimal reproducible example in my report
          required: true
  - type: dropdown
    id: operating-system
    attributes:
      label: Operating System
      description: What host operating system are you using to run Selenium?
      options:
        - Windows
        - macOS
        - Linux (please specify in the description)
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: Selenium Language Binding
      description: Which Selenium language binding are you using?
      options:
        - Java
        - Python
        - JavaScript/Node.js
        - C#/.NET
        - Ruby
    validations:
      required: true
  - type: dropdown
    id: browsers
    attributes:
      label: Which browsers are you experiencing the issue with?
      multiple: true
      options:
        - Chrome
        - Firefox
        - Edge
        - Safari
        - Other (please specify in the description)
    validations:
      required: true
  - type: dropdown
    id: using-grid
    attributes:
      label: Are you using Selenium Grid?
      options:
        - "No"
        - "Yes"
    validations:
      required: true

